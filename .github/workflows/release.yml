name: Release asset

# HACS installs the integration from skoda_api_connect.zip of a release (zip_release in hacs.json),
# and counts its downloads. Every published release needs it, otherwise HACS cannot install that version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to add the ZIP to (e.g. v0.5.7)
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Build and upload skoda_api_connect.zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check that the manifest version matches the tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/skoda_api_connect/manifest.json'))['version'])")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::manifest.json has version ${version}, but the release tag is ${TAG}"
            exit 1
          fi

      - name: Build the ZIP (integration files at the top level)
        run: |
          cd custom_components/skoda_api_connect
          find . -name "__pycache__" -prune -o -type f -print | sort | zip -X -q "${GITHUB_WORKSPACE}/skoda_api_connect.zip" -@
          unzip -l "${GITHUB_WORKSPACE}/skoda_api_connect.zip" | tail -n 3

      - name: Upload the ZIP to the release
        run: gh release upload "${TAG}" skoda_api_connect.zip --clobber --repo "${GITHUB_REPOSITORY}"
